name: Daily External Database Backup (DR)

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Execute Off-Platform pg_dump Backup & Cloudflare R2 Storage Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute pg_dump & Compress Database Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_FILE="nexops_prod_backup_${TIMESTAMP}.sql.gz"
          echo "Starting off-platform pg_dump backup at $(date -u)..."
          pg_dump "$DATABASE_URL" --no-owner --no-acl --clean --if-exists | gzip -9 > "$BACKUP_FILE"
          FILESIZE=$(stat -c%s "$BACKUP_FILE")
          echo "Backup file created: $BACKUP_FILE (Size: $FILESIZE bytes)"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

      - name: Upload Backup to Cloudflare R2 Object Storage Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Uploading $BACKUP_FILE to Cloudflare R2 bucket s3://${R2_BUCKET_NAME}/database-backups/..."
          aws s3 cp "$BACKUP_FILE" "s3://${R2_BUCKET_NAME}/database-backups/$BACKUP_FILE" --endpoint-url "$ENDPOINT_URL"

          echo "=== VERIFYING CLOUDFLARE R2 OBJECT STORAGE LANDING ==="
          aws s3 ls "s3://${R2_BUCKET_NAME}/database-backups/" --endpoint-url "$ENDPOINT_URL" --human-readable
