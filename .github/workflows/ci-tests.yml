name: CI - Test Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Backend Pytest Suite (Ephemeral DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexops_app_role
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: nexops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: NexOps
      APP_ENV: test
      DEBUG: "true"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://nexops_app_role:ci_ephemeral_password@localhost:5432/nexops_ci
      LOCAL_MIGRATION_DATABASE_URL: postgresql+asyncpg://nexops_app_role:ci_ephemeral_password@localhost:5432/nexops_ci
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: '["http://localhost:3000"]'
      FIREBASE_SERVICE_ACCOUNT_PATH: /tmp/firebase-service-account.json
      ENCRYPTION_KEY: ${{ secrets.CI_TEST_ENCRYPTION_KEY || 'MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=' }}
      GITHUB_WEBHOOK_SECRET: ci_test_github_webhook_secret
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify Ephemeral Localhost Isolation
        run: |
          python3 -c "
          from urllib.parse import urlparse
          import os, sys
          for key in ('DATABASE_URL', 'LOCAL_MIGRATION_DATABASE_URL'):
              val = os.environ.get(key, '')
              clean = val.replace('+asyncpg', '')
              host = urlparse(clean).hostname
              if host not in ('localhost', '127.0.0.1'):
                  print(f'FATAL SECURITY GUARD: {key} host is {host}, expected localhost/127.0.0.1!', file=sys.stderr)
                  sys.exit(1)
          print('Localhost database isolation verified: ephemeral CI container in use.')
          "

      - name: Create Dummy Firebase Service Account
        run: |
          echo '{"type": "service_account", "project_id": "nexops-ci-test"}' > /tmp/firebase-service-account.json

      - name: Run Database Migrations (Alembic)
        run: |
          alembic -x target=local upgrade head

      - name: Run Full Test Suite
        run: |
          pytest -v 2>&1 | tee pytest-output.log

      - name: Upload Test Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-output.log
