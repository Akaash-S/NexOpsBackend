services:
  - type: web
    name: nexops-backend
    env: docker
    plan: free
    region: ohio
    healthCheckPath: /api/v1/health # if you have a health endpoint
    envVars:
      - key: APP_NAME
        value: NexOps
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      # Note: Set these explicitly in the Render Dashboard -> Environment
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false # Set this to your Vercel URL (e.g. https://nexops-frontend.vercel.app)
      - key: FRONTEND_URL
        sync: false # Must match the deployed frontend origin (e.g. https://nexops-frontend.vercel.app)
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # For Firebase: upload service-account.json in Render Dashboard -> Secret Files
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/service-account.json
